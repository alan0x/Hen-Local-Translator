name: Build draft GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate versions and tag
        id: metadata
        shell: bash
        run: |
          node scripts/version.mjs check
          node scripts/version.mjs check-tag "$GITHUB_REF_NAME"
          version="$(node scripts/version.mjs current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build Apple Silicon macOS release
    needs: validate
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: "1.92.0"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hen-local-translator-shell/ui/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Select release signing mode
        id: release-mode
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=()
          required=(
            APPLE_CERTIFICATE_P12
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} == 0 )); then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "All Apple credentials are available; producing a signed and notarized draft."
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "Apple credentials are incomplete; producing an unsigned internal-test draft."
            printf 'Missing secret: %s\n' "${missing[@]}"
          fi

      - name: Import Developer ID certificate
        id: signing
        if: steps.release-mode.outputs.signing == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/hen-local-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-arm64-cargo-

      - name: Install pinned Dora CLI
        run: cargo install dora-cli --version 0.4.0 --locked

      - name: Verify runner and release metadata
        run: |
          test "$(uname -m)" = "arm64"
          node scripts/version.mjs check
          node scripts/version.mjs check-tag "$GITHUB_REF_NAME"

      - name: Build application bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HEN_LOCAL_SUPABASE_URL: ${{ secrets.HEN_LOCAL_SUPABASE_URL }}
          HEN_LOCAL_SUPABASE_ANON_KEY: ${{ secrets.HEN_LOCAL_SUPABASE_ANON_KEY }}
          HEN_LOCAL_AUTH_PROVIDER: ${{ vars.HEN_LOCAL_AUTH_PROVIDER }}
          HEN_LOCAL_ACCOUNT_URL: ${{ vars.HEN_LOCAL_ACCOUNT_URL }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY secret" >&2; exit 1; }
          test -n "$HEN_LOCAL_SUPABASE_URL" || { echo "Missing HEN_LOCAL_SUPABASE_URL secret" >&2; exit 1; }
          test -n "$HEN_LOCAL_SUPABASE_ANON_KEY" || { echo "Missing HEN_LOCAL_SUPABASE_ANON_KEY secret" >&2; exit 1; }
          HEN_LOCAL_CARGO_TARGET_DIR="$RUNNER_TEMP/hen-local-target" bash scripts/build_macos_app.sh

      - name: Verify application bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          app="dist/Hen Local Translator.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/hen-local-translator"
          for sidecar in dora dora-qwen3-asr dora-qwen35-translator qwen-tts-node hen-local-init mlx.metallib; do
            test -f "$app/Contents/MacOS/$sidecar"
          done
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$bundle_version" = "$VERSION"
          file "$app/Contents/MacOS/hen-local-translator" | grep -q arm64

      - name: Sign application bundle
        if: steps.release-mode.outputs.signing == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: bash scripts/macos_sign_and_notarize.sh --app "dist/Hen Local Translator.app"

      - name: Build DMG
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash scripts/build_macos_dmg.sh
          dmg="dist/Hen-Local-Translator-v${VERSION}.dmg"
          test -f "$dmg"
          hdiutil verify "$dmg"

      - name: Rebuild signed updater archive from final app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          archive="dist/Hen-Local-Translator-v${VERSION}.app.tar.gz"
          rm -f "$archive" "$archive.sig"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C dist "Hen Local Translator.app"
          ./hen-local-translator-shell/ui/node_modules/.bin/tauri signer sign "$archive"
          test -s "$archive.sig"

      - name: Sign and notarize DMG
        if: steps.release-mode.outputs.signing == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/macos_sign_and_notarize.sh --dmg "dist/Hen-Local-Translator-v${VERSION}.dmg"

      - name: Verify notarized release artifact
        if: steps.release-mode.outputs.signing == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          dmg="dist/Hen-Local-Translator-v${VERSION}.dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

      - name: Mark unsigned internal test build
        if: steps.release-mode.outputs.signing != 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          cat > dist/UNSIGNED-INTERNAL-TEST-BUILD.txt <<EOF
          Hen Local Translator v${VERSION}

          This build is unsigned and has not been notarized by Apple.
          It is for internal testing only and must not be published to customers.
          macOS Gatekeeper warnings are expected.
          EOF

      - name: Generate release checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist
          shasum -a 256 \
            "Hen-Local-Translator-v${VERSION}.dmg" \
            "Hen-Local-Translator-v${VERSION}.app.tar.gz" \
            > SHA256SUMS

      - name: Generate updater manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/generate_latest_json.mjs \
            --version "$VERSION" \
            --archive "dist/Hen-Local-Translator-v${VERSION}.app.tar.gz" \
            --signature "dist/Hen-Local-Translator-v${VERSION}.app.tar.gz.sig" \
            --tag "$GITHUB_REF_NAME" \
            --output dist/latest.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hen-Local-Translator-v${{ needs.validate.outputs.version }}-macos-arm64
          path: |
            dist/Hen-Local-Translator-v${{ needs.validate.outputs.version }}.dmg
            dist/Hen-Local-Translator-v${{ needs.validate.outputs.version }}.app.tar.gz
            dist/Hen-Local-Translator-v${{ needs.validate.outputs.version }}.app.tar.gz.sig
            dist/latest.json
            dist/SHA256SUMS
            dist/UNSIGNED-INTERNAL-TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SIGNED: ${{ steps.release-mode.outputs.signing }}
        shell: bash
        run: |
          dmg="dist/Hen-Local-Translator-v${VERSION}.dmg"
          updater="dist/Hen-Local-Translator-v${VERSION}.app.tar.gz"
          assets=("$dmg" "$updater" "$updater.sig" dist/latest.json dist/SHA256SUMS)
          if [[ "$SIGNED" == "true" ]]; then
            notes="Automated Developer ID signed and Apple-notarized macOS build. Keep this release as a draft until installation and update smoke tests pass."
          else
            notes="⚠️ UNSIGNED INTERNAL TEST BUILD. This build is not notarized, will trigger macOS Gatekeeper warnings, and must not be published to customers."
            assets+=(dist/UNSIGNED-INTERNAL-TEST-BUILD.txt)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on a published release" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            args=(
              "$GITHUB_REF_NAME"
              "${assets[@]}"
              --draft
              --verify-tag
              --title "Hen Local Translator ${VERSION}"
              --generate-notes
              --notes "$notes"
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
